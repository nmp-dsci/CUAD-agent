name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint — ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # ruff is not a project dependency, so it runs ephemerally via uvx pinned
      # to the workspace standard (0.14.2, matching data-qa-agent). Scoped to the
      # real source (src, tests); ai_specs/ (example scripts) and opensrc/
      # (vendored upstream clones) are excluded from the gate.
      - name: Ruff (lint)
        run: uvx ruff@0.14.2 check src tests
      - name: Ruff (format check)
        run: uvx ruff@0.14.2 format --check src tests

  test:
    name: Test — pytest (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # requires-python is ">=3.12,<3.14" and no .python-version is committed.
      # Pin sync to 3.12 so uv does not nondeterministically pick 3.13.
      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv sync --python 3.12
      # Scope to tests/ so the vendored opensrc/ upstream suite is never
      # collected. Every test runs fully offline: dry_run=True / llm=None /
      # offline query-enrichment / tfidf embeddings — no API key, network call,
      # model download, or DB required. (First run installs the full locked dep
      # set incl. torch/transformers, so it is slow but green.)
      - name: pytest
        run: uv run pytest tests/
      # Coverage gate omitted: pytest-cov is not a dependency on main.
      # TODO(eval-gate): no committed offline eval/regression snapshot test exists
      # yet (cf. transcript-rag-agent tests/evals/test_committed_runs.py).
