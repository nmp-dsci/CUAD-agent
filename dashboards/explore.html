acilities under this Section 4.12; provided that Customer will use good faith efforts to choose dates of inspection or audit that do not unreasonably interfere with the operation of Manufacturer's business; provided, further, that Customer shall consider in good faith any alternative dates of inspection or audit proposed by Manufacturer within five (5) days of Manufacturer's receipt of such notice (it being understood that nothing in this Section 4.12 shall require Customer to accept any such proposed alternative dates of inspection or audit)", "Customer may exercise its inspection rights under this Section 5.3(d) upon receipt of any information that would suggest to a reasonable Person that Manufacturer is not fulfilling its obligations under this Section 5.3.", "In addition, Customer may audit Manufacturer's Records and Facilities for the purpose of verifying that Manufacturer's procedures are in accordance with the C-TPAT security criteria, and Manufacturer shall provide Customer with access to Manufacturer's Records and Facilities reasonably necessary for the purpose of conducting such audit.", "Manufacturer shall permit Customer (at Customer's expense) to conduct reasonable annual reviews of the environmental and health and safety practices and performance of the Facilities with respect to the Products where Manufacturer's performance under this Agreement is occurring; provided that such review shall not include any invasive sampling at such Facilities and shall not unreasonably interfere with Manufacturer's operation of such Facilities.", "Customer shall be entitled to review, upon reasonable prior written notice, all manufacturing Records relating to such samples, including all analytical procedures and cleaning validation relating to the equipment used in connection with the manufacture of the samples", "Manufacturer will provide Customer with periodic access, upon reasonable notice, to any of its Facilities where it is performing under this Agreement, to its employees and Records and to any associated dormitories or lodging that Manufacturer provides to its employees, to permit Customer to determine Manufacturer's compliance with this Section 5.3.", "Any such inspection or audit shall include access to relevant Records (subject to the terms of Section 15.2) and Personnel and being present during, as applicable, start-up manufacturing operations, validation, cleaning, sampling, laboratory testing, warehouse receiving and storage, pack out and shipping."]}, {"question_index": 34, "category": "Uncapped Liability", "description": "Is a party’s liability uncapped upon the breach of its obligation in the contract? This also includes uncap liability for a particular type of breach such as IP infringement or breach of confidentiality obligation.", "answer_format": "Yes/No", "group": "6", "question": "Highlight the parts (if any) of this contract related to \"Uncapped Liability\" that should be reviewed by a lawyer. Details: Is a party’s liability uncapped upon the breach of its obligation in the contract? This also includes uncap liability for a particular type of breach such as IP infringement or breach of confidentiality obligation.", "is_impossible": false, "answers": ["Except in the event of (i) Third Party Claims subject to a Party's indemnification obligations pursuant to Section 10.1, (ii) Third Party Claims subject to a Party's indemnification obligations pursuant to Section 10.2, (iii) the gross negligence, fraud or willful misconduct of a Party or its Personnel, (iv) a Party's willful breach of this Agreement, (v) a breach of Section 13 or (vi) customer liabilities pursuant to, and subject to the limitations set forth in, Section 2.5(e), neither Party's aggregate liability to the other Party (or its Personnel that are indemnitees under Section 10.1 or Section 10.2, as applicable) under this Agreement for the initial twelve (12) month period immediately following the Effective Date, and for any twelve (12) month peri er within sixty (60) days after Customer first becomes aware of any such Latent Defect."]}, {"question_index": 38, "category": "Insurance", "description": "Is there a requirement for insurance that must be maintained by one party for the benefit of the counterparty?", "answer_format": "Yes/No", "group": "-", "question": "Highlight the parts (if any) of this contract related to \"Insurance\" that should be reviewed by a lawyer. Details: Is there a requirement for insurance that must be maintained by one party for the benefit of the counterparty?", "is_impossible": false, "answers": ["Automobile and Truck Liability Insurance: $2,000,000 combined single limit for bodily injury and property damage arising out of all owned, non- owned and hired vehicles, including coverage for all automotive and truck equipment used in the performance of this Agreement and including the loading and unloading of same.", "The insurance required under this Section 11 shall be written for not less than any limits of liability specified herein or as required by applicable Law, whichever is greater.", "During the Term, Manufacturer shall self-insure or shall provide and maintain such insurance coverage, in minimum types and amounts as described below in this Section 11.", "All insurance carriers shall have a minimum of \"A-\" A.M. Best rating.", "Manufacturer shall furnish to Customer certificates of insurance (electronic is acceptable), evidencing the required insurance coverage, upon execution of this Agreement and annually, thereafter.", "Commercial general liability insurance with the following limits and forms/endorsements:\n\nEach Occurrence: $2,000,000 (i) Occurrence form including premises and operations coverage, property damage, liability, personal injury coverage, products and completed operations coverage, and transit. (ii) To the extent of Manufacturer's indemnification obligations, Customer and its Affiliates shall be additional insureds via ISO form CG20101185 or its equivalent. od and valuable consideration, the receipt and sufficiency of which is hereby acknowledged by the parties hereto, the parties agree as follows:\n\n1. Services. The Consultant agrees to perform such consulting, advisory and related services to and for the Company as may be reasonably requested from time to time by the Company, including, but not limited to, the services specified on Schedule A to this Agreement. The Consultant also agrees to provide the Company with related services that may be requested from time to time by the Company. During the Consultation Period (as defined below) and for a period of one year thereafter, except in connection with his performance of the Services, the Consultant shall not engage in any activity in the field described on Schedule A to this Agreement, and he shall not assist any other person or organization that engages in any such activity.\n\n2. Term. This Agreement shall commence on the Effective Date and shall continue until the four-year anniversary of the Effective Date (such period, as it may be extended, either by the mutual written agreement of the parties or automatically, or earlier terminated being referred to as the \"Consultation Period\"), unless sooner terminated in accordance with the provisions of Section 4, and shall automatically renew for successive one-year periods, unless the Company provides 90 days' notice of termination before any such successive period.\n\n3. Compensation.\n\n3.1 Shares. In connection with the execution of this Agreement, Consultant and Company shall enter into a Restricted Stock Agreement. Subject to approval of the Board of Directors of the Company, the Company shall issue and sell to the Consultant, and the Consultant shall purchase from the Company, subject to the terms and conditions set forth in this Agreement and the Restricted Stock Agreement, 1,990,000 shares (the \"Shares\") of common stock, $0.0001 par value, of the Company (\"Common Stock\"), at a purchase price of $0.0001 per share, for an aggregate purchase price of $190. Such Shares are in addition to the 10,000 shares of Common Stock held by the Consultant as of the date hereof. The Consultant agrees that the Shares shall be subject to the terms of the Restricted Stock Agreement.\n\n3.2 Expenses. The Company shall reimburse the Consultant for all reasonable and necessary documented out of pocket expenses incurred or paid by the Consultant in connection with, or related to, the performance of Consultant's services under this Agreement.\n\n\n\n\n\nThe Consultant shall submit to the Company itemized monthly statements, in a form satisfactory to the Company, of such expenses incurred in the previous month. The Company shall pay to the Consultant amounts shown on each such statement within thirty (30) days after receipt thereof.\n\n3.3 Benefits. The Consultant shall not be entitled to any benefits, coverages or privileges, including, without limitation, health insurance, social security, unemployment, medical or pension payments, made available to employees of the Company.\n\n4. Termination. The Company may terminate the Consultation Period at any time for Cause (as defined below). In the event of such termination, the Consultant shall be entitled to payment hereunder and for expenses paid or incurred prior to the effective date of termination. Such payments shall constitute full settlement of any and all claims of the Consultant of every description against the Company. Notwithstanding the foregoing, the Company may terminate the Consultation Period effective immediately upon receipt of written notice by the Consultant, if the Consultant breaches or threatens to breach any provision of Section 6. For purposes of this Section 4, \"Cause\" shall exist in the event of (i) a good faith finding by the Board of Directors of the Company (A) of repeated and willful failure of the Consultant after written notice to perform his reasonable Services for the Company, or (B) that the Consultant has engaged in dishonesty, gross negligence or misconduct; or (ii) the conviction of the Consultant of, or the entry of a pleading of guilty or nolo contendere by the Consultant to, any crime involving moral turpitude or any felony. The Consultant may terminate the Consultation Period at any time upon thirty (30) days' written notice.\n\n5. Cooperation. The Consultant shall use Consultant's best efforts in the performance of Consultant's obligations under this Agreement. The Company shall provide such access to its information and property as may be reasonably required in order to permit the Consultant to perform Consultant's obligations hereunder. The Consultant shall cooperate with the Company's personnel, shall not interfere with the conduct of the Company's business and shall observe all rules, regulations and security requirements of the Company concerning the safety of persons and property.\n\n6. Proprietary Information and Inventions.\n\n6.1 Proprietary Information.\n\n(a) The Consultant acknowledges that Consultant's relationship with the Company is one of high trust and confidence and that in the course of Consultant's service to the Company, Consultant will have access to and contact with Proprietary Information. The Consultant will not disclose any Proprietary Information to any person or entity other than employees of the Company or use the same for any purposes (other than in the performance of the services) without written approval by an officer of the Company, either during or after the Consultation Period, unless and until such Proprietary Information has become public knowledge without fault by the Consultant. - 2 -\n\n\n\n\n\n(b) For purposes of this Agreement, Proprietary Information shall mean, by way of illustration and not limitation, all information, whether or not in writing, whether or not patentable and whether or not copyrightable, of a private, secret or confidential nature, owned, possessed or used by the Company, concerning the Company's business, business relationships or financial affairs, including, without limitation, any Invention, formula, vendor information, customer information, apparatus, equipment, trade secret, process, research, report, technical or research data, clinical data, know-how, computer program, software, software documentation, hardware design, technology, product, processes, methods, techniques, formulas, compounds, projects, developments, marketing or business plan, forecast, unpublished financial statement, budget, license, price, cost, customer, supplier or personnel information or employee list that is communicated to, learned of, developed or otherwise acquired by the Consultant in the course of Consultant's service as a consultant to the Company.\n\n(c) The Consultant's obligations under this Section 6.1 shall not apply to any information that (i) is or becomes known to the general public under circumstances involving no breach by the Consultant or others of the terms of this Section 6.1, (ii) is generally disclosed to third parties by the Company without restriction on such third parties, or (iii) is approved for release by written authorization of an officer of the Company.\n\n(d) The Consultant agrees that all files, documents, letters, memoranda, reports, records, data, sketches, drawings, models, laboratory notebooks, program listings, computer equipment or devices, computer programs or other written, photographic, or other tangible material containing Proprietary Information, whether created by the Consultant or others, which shall come into Consultant's custody or possession, shall be and are the exclusive property of the Company to be used by the Consultant only in the performance of Consultant's duties for the Company and shall not be copied or removed from the Company premises except in the pursuit of the business of the Company. All such materials or copies thereof and all tangible property of the Company in the custody or possession of the Consultant shall be delivered to the Company, upon the earlier of (i) a request by the Company or (ii) the termination of this Agreement. After such delivery, the Consultant shall not retain any such materials or copies thereof or any such tangible property.\n\n(e) The Consultant agrees that Consultant's obligation not to disclose or to use information and materials of the types set forth in paragraphs (b) and (d) above, and Consultant's obligation to return materials and tangible property set forth in paragraph (d) above extends to such types of information, materials and tangible property of customers of the Company or suppliers to the Company or other third parties who may have disclosed or entrusted the same to the Company or to the Consultant.\n\n(f) The Consultant acknowledges that the Company from time to time may have agreements with other persons or with the United States Government, or agencies thereof, that impose obligations or restrictions on the Company regarding inventions made during the course of work under such agreements or regarding the confidential nature of such work. The Consultant agrees to be bound by all such obligations and restrictions that are known to Consultant and to take all action necessary to discharge the obligations of the Company under such agreements. - 3 -\n\n\n\n\n\n6.2 Inventions.\n\n(a) All inventions, ideas, creations, discoveries, computer programs, works of authorship, data, developments, technology, designs, innovations and improvements (whether or not patentable and whether or not copyrightable) which are made, conceived, reduced to practice, created, written, designed or developed by the Consultant, solely or jointly with others or under Consultant's direction and whether during normal business hours or otherwise, (i) during the Consultation Period if related to the business of the Company or (ii) during or after the Consultation Period if resulting or directly derived from Proprietary Information (as defined above) (collectively under clauses (i) and (ii), \"Inventions\"), shall be the sole property of the Company. The Consultant hereby assigns to the Company all Inventions and any and all related patents, copyrights, trademarks, trade names, and other industrial and intellectual property rights and applications therefor, in the United States and elsewhere and appoints any officer of the Company as Consultant's duly authorized attorney to execute, file, prosecute and protect the same before any government agency, court or authority. However, this paragraph shall not apply to Inventions which do not relate to the business or research and development conducted or planned to be conducted by the Company at the time such Invention is created, made, conceived or reduced to practice and which are made and conceived by the Consultant not during normal working hours, not on the Company's premises and not using the Company's tools, devices, equipment or Proprietary Information. The Consultant further acknowledges that each original work of authorship which is made by the Consultant (solely or jointly with others) within the scope of this Agreement and which is protectable by copyright is a \"work made for hire,\" as that term is defined in the United States Copyright Act.\n\n(b) The Consultant agrees that if, in the course of performing the Services, the Consultant incorporates into any Invention developed under this Agreement any preexisting invention, improvement, development, concept, discovery or other proprietary information owned by the Consultant or in which the Consultant has an interest (\"Prior Inventions\"), (i) the Consultant will inform the Company, in writing before incorporating such Prior Inventions into any Invention, and (ii) the Company is hereby granted a nonexclusive, royalty-free, perpetual, irrevocable, transferable worldwide license with the right to grant and authorize sublicenses, to make, have made, modify, use, import, offer for sale, sell, reproduce, distribute, modify, adapt, prepare derivative works of, display, perform, and otherwise exploit such Prior Inventions, without restriction, including, without limitation, as part of or in connection with such Invention, and to practice any method related thereto. The Consultant will not incorporate any invention, improvement, development, concept, discovery or other proprietary information owned by any third party into any Invention without the Company's prior written permission.\n\n(c) Upon the request of the Company and at the Company's expense, the Consultant shall execute such further assignments, documents and other instruments as may be necessary or desirable to fully and completely assign all Inventions to the Company and to assist the Company in applying for, obtaining and enforcing patents or copyrights or other rights in the United States and in any foreign country with respect to any Invention. The Consultant also hereby waives all claims to moral rights in any Inventions.\n\n(d) The Consultant shall promptly disclose to the Company all Inventions and will maintain adequate and current written records (in the form of notes, sketches, drawings and as may be specified by the Company) to document the conception and/or first actual reduction to practice of any Invention. Such written records shall be available to and remain the sole property of the Company at all times. - 4 -\n\n\n\n\n\n7. Non-Solicitation. During the Consultation Period and for a period of one year thereafter, the Consultant shall not, either alone or in association with others, (i) solicit, or permit any organization directly or indirectly controlled by the Consultant to solicit, any employee of the Company to leave the employ of the Company; or (ii) solicit for employment, hire or engage as an independent contractor, or permit any organization directly or indirectly controlled by the Consultant to solicit for employment, hire or engage as an independent contractor, any person who is employed or engaged by the Company; provided, that this clause (ii) shall not apply to any individual whose employment with the Company has been terminated for a period of six months or longer.\n\n8. Other Agreements; Warranty.\n\n8.1 The Consultant hereby represents that, except as the Consultant has disclosed in writing to the Company, the Consultant is not bound by the terms of any agreement with any third party to refrain from using or disclosing any trade secret or confidential or proprietary information in the course of Consultant's consultancy with the Company, to refrain from competing, directly or indirectly, with the business of such third party or to refrain from soliciting employees, customers or suppliers of such third party. The Consultant further represents that Consultant's performance of all the terms of this Agreement and the performance of the services as a consultant of the Company do not and will not breach any agreement with any third party to which the Consultant is a party (including, without limitation, any nondisclosure or non-competition agreement), and that the Consultant will not disclose to the Company or induce the Company to use any confidential or proprietary information or material belonging to any current or previous employer or others.\n\n8.2 The Consultant hereby represents, warrants and covenants that Consultant has the skills and experience necessary to perform the services, that Consultant will perform said services in a professional, competent and timely manner, that Consultant has the power to enter into this Agreement and that Consultant's performance hereunder will not infringe upon or violate the rights of any third party or violate any federal, state or municipal laws.\n\n9. Independent Contractor Status.\n\n9.1 The Consultant shall perform all services under this Agreement as an \"independent contractor\" and not as an employee or agent of the Company. The Consultant is not authorized to assume or create any obligation or responsibility, express or implied, on behalf of, or in the name of, the Company or to bind the Company in any manner.\n\n9.2 The Consultant shall have the right to control and determine the time, place, methods, manner and means of performing the services. In performing the services, the amount of time devoted by the Consultant on any given day will be entirely within the Consultant's control, and the Company will rely on the Consultant to put in the amount of time necessary to fulfill the requirements of this Agreement. The Consultant will provide all equipment and supplies required to perform the services. The Consultant is not required to attend regular meetings at the Company. However, upon reasonable notice, the Consultant shall meet with representatives of the Company at a location to be designated by the parties to this Agreement. - 5 -\n\n\n\n\n\n9.3 In the performance of the services, the Consultant has the authority to control and direct the performance of the details of the services, the Company being interested only in the results obtained. However, the services contemplated by the Agreement must meet the Company's standards and approval and shall be subject to the Company's general right of inspection and supervision to secure their satisfactory completion.\n\n9.4 The Consultant shall not use the Company's trade names, trademarks, service names or service marks without the prior approval of the Company.\n\n9.5 The Consultant shall be solely responsible for all state and federal income taxes, unemployment insurance and social security taxes in connection with this Agreement and for maintaining adequate workers' compensation insurance coverage.\n\n10. Remedies. The Consultant acknowledges that any breach of the provisions of Section 1, 6 or 7 of this Agreement shall result in serious and irreparable injury to the Company for which the Company cannot be adequately compensated by monetary damages alone. The Consultant agrees, therefore, that, in addition to any other remedy the Company may have, the Company shall be entitled to enforce the specific performance of this Agreement by the Consultant and to seek both temporary and permanent injunctive relief (to the extent permitted by law) without the necessity of proving actual damages or posting a bond.\n\n11. Notices. All notices required or permitted under this Agreement shall be in writing and shall be deemed effective upon personal delivery or upon deposit in the United States Post Office, by registered or certified mail, postage prepaid, addressed to the other party at the address shown above, or at such other address or addresses as either party shall designate to the other in accordance with this Section 11.\n\n12. Pronouns. Whenever the context may require, any pronouns used in this Agreement shall include the corresponding masculine, feminine or neuter forms, and the singular forms of nouns and pronouns shall include the plural, and vice versa.\n\n13. Entire Agreement. This Agreement constitutes the entire agreement between the parties and supersedes all prior agreements and understandings, whether written or oral, relating to the subject matter of this Agreement.\n\n14. Amendment. This Agreement may be amended or modified only by a written instrument executed by both the Company and the Consultant.\n\n15. Non-Assignability of Contract. This Agreement is personal to the Consultant and the Consultant shall not have the right to assign any of Consultant's rights or delegate any of Consultant's duties without the express written consent of the Company. Any non-consented-to assignment or delegation, whether express or implied or by operation of law, shall be void and shall constitute a breach and a default by the Consultant. - 6 -\n\n\n\n\n\n16. Governing Law. This Agreement shall be governed by and construed in accordance with the laws of the Commonwealth of Massachusetts without giving effect to any choice or conflict of law provision or rule that would cause the application of laws of any other jurisdiction.\n\n17. Successors and Assigns. This Agreement shall be binding upon, and inure to the benefit of, both parties and their respective successors and assigns, including any corporation with which, or into which, the Company may be merged or which may succeed to its assets or business, provided, however, that the obligations of the Consultant are personal and shall not be assigned by Consultant.\n\n18. Interpretation. If any restriction set forth in Section 1, 6 or 7 is found by any court of competent jurisdiction to be unenforceable because it extends for too long a period of time or over too great a range of activities or in too broad a geographic area, it shall be interpreted to extend only over the maximum period of time, range of activities or geographic area as to which it may be enforceable.\n\n19. Survival. The last sentence of Section 1 and Sections 4 through 20 shall survive the expiration or termination of this Agreement.\n\n20. Miscellaneous.\n\n20.1 No delay or omission by the Company in exercising any right under this Agreement shall operate as a waiver of that or any other right. A waiver or consent given by the Company on any one occasion shall be effective only in that instance and shall not be construed as a bar or waiver of any right on any other occasion.\n\n20.2 The captions of the sections of this Agreement are for convenience of reference only and in no way define, limit or affect the scope or substance of any section of this Agreement.\n\n20.3 In the event that any provision of this Agreement shall be invalid, illegal or otherwise unenforceable, the validity, legality and enforceability of the remaining provisions shall in no way be affected or impaired thereby.\n\n[Remainder of Page Intentionally Left Blank] - 7 -\n\n\n\n\n\nIN WITNESS WHEREOF, the parties hereto have executed this Consulting Agreement as of the date and year first above written. COMPANY:\n\nIMMUNOTOLERANCE, INC.\n\nBy: /s/ Dan Matloff Name: Dan Matloff Title: CFO\n\nCONSULTANT:\n\n/s/ Alan Crane Name: Alan Crane\n\nSIGNATURE PAGE TO CONSULTING AGREEMENT\n\n\n\n\n\nSCHEDULE A\n\nConsultant will provide advice and services to the Company as requested by the Board of Directors from time to time. The field for purposes of Section 1 is defined as drugs and cell-based therapies designed for tissue-specific immunosuppression.", "questions": [{"question_index": 0, "category": "Document Name", "description": "The name of the contract", "answer_format": "Contract Name", "group": "-", "question": "Highlight the parts (if any) of this contract related to \"Document Name\" that should be reviewed by a lawyer. Details: The name of the contract", "is_impossible": false, "answers": ["CONSULTING AGREEMENT"]}, {"question_index": 1, "category": "Parties", "description": "The two or more parties who signed the contract", "answer_format": "Entity or individual names", "group": "-", "question": "Highlight the parts (if any) of this contract related to \"Parties\" that should be reviewed by a lawyer. Details: The two or more parties who signed the contract", "is_impossible": false, "answers": ["Consultant", "Immunotolerance, Inc.", "Alan Crane", "Company"]}, {"question_index": 2, "category": "Agreement Date", "description": "The date of the contract", "answer_format": "Date (mm/dd/yyyy)", "group": "1", "question": "Highlight the parts (if any) of this contract related to \"Agreement Date\" that should be reviewed by a lawyer. Details: The date of the contract", "is_impossible": false, "answers": ["27t h day of March, 2017"]}, {"question_index": 3, "category": "Effective Date", "description": "The date when the contract is effective", "answer_format": "Date (mm/dd/yyyy)", "group": "1", "question": "Highlight the parts (if any) of this contract related to \"Effective Date\" that should be reviewed by a lawyer. Details: The date when the contract is effective ", "is_impossible": true, "answers": []}, {"question_index": 4, "category": "Expiration D  herein contained, the parties hereby agree as follows: 1. Definitions. Capitalized words and phrases used in this Agreement that are not otherwise defined herein shall have the meanings set forth below: 1.2. The term \"Affiliate\" means an entity controlling, controlled, or under common control with a party. For these purposes, \"control\" means: (a) the possession, directly or indirectly, of the power to direct the management or policies of an entity, whether through the ownership of voting securities, by contract or otherwise; or (b) the ownership, directly or indirectly, of at least fifty percent (50%) of the voting securities or other ownership interest of an entity. 1.2. The term \"Business\" means a branded real estate seminar style education business that uses the Licensed Intellectual Property, including a to-be-determined trademark for the Business, to market and sell customers Products through any form of communication or media. 1.3 The term \"Cash Sales\" shall mean the gross cash proceeds actually received by LEA or T&B from the sale of Products to persons responding to a Business-branded marketing campaign conducted by LEA that uses any or any combination of Licensed Intellectual Property. Cash Sales shall exclude any merchant fees, taxes, shipping, refunds (e.g., returns, right of rescission, NSF checks, and credit card chargebacks), rebates, and bad debt\n\n1\n\nSource: LEGACY EDUCATION ALLIANCE, INC., 10-K, 3/30/2020\n\n\n\n\n\nCertain identified information has been excluded from this exhibit because it is both (i) not material and (ii) would be competitively harmful if publicly disclosed. 1.4. The term \"Confidential Information\" means any and all information which is not readily ascertainable by proper means and which derives economic value, actual or potential from not being generally known and which has been the subject of efforts that are reasonable under the circumstances to maintain its secrecy. All information relating to the products or operations of a party, which is provided to the other party, or to which the other party otherwise obtains access, pursuant to, or as a result of, this Agreement shall be treated as Confidential Information hereunder, except such information which the other party can clearly show: (a) at the time of this Agreement is publicly and openly known; (b) after the date of this Agreement becomes publicly and openly known through no fault of the other party; (c) comes into the other party's possession and lawfully obtained by the other party from a source other than from the party or a source deriving from the party, and not subject to any obligation of confidentiality or restrictions on use; or (d) is approved for release by written authorization of the other party 1.5 The term \"Customer Data\" means documents and other media (whether in human or machine-readable form) containing information, regarding customers and prospective customers. Without limiting the generality of the foregoing, the term \"Customer Data\" shall include customer lists and personally identifiable information about customers and prospective customers. 1.6 The term \"Educational Materials\" means all advertising and promotional materials, handouts, workbooks, presentations, manuals, software programs, and any other literature or material and other collateral items employed, provided, distributed, sold, or otherwise made available in connection with the Business, in any form of communication or media and whether or not in machine or human readable format. 1.7 The term \"Exclusive Field of Use\" means the marketing, sale and distribution (including e-distribution) of any in-person or remote (e.g., livestream of a live event, recording of a live event, and/or on-demand) service offerings in real estate investing strategies and techniques, asset protection, product and entrepreneurship in any form of communication or media to one or more recipients, including, but not limited to, workshops, seminars, webinars, coaching, and mentorships, and related product or services. 1.8. The term \"Licensed Intellectual Property\" means individually, collectively or in any combination, T&B's copyrights (whether registered or not), including, without limitation, the Educational Materials and any and all copyrightable literary works and audio-visual works developed for use in the Business, trademarks and trade names (whether registered or unregistered) used in connection with the Business; as well as customer lists, concepts, developments, trade secrets, methods, systems, programs, improvements, data and information (whether in perceivable or machine-readable form), and works of authorship including, but not limited to the (a) the Licensed Marks and (b) the name, image, and likeness of the T&B Personality. 1.9. The term \"Licensed Marks\" The term \"Licensed Marks\" shall mean T&B's current and future trademarks, service marks, and trade dress used in connection with the Business.\n\n2\n\nSource: LEGACY EDUCATION ALLIANCE, INC., 10-K, 3/30/2020\n\n\n\n\n\nCertain identified information has been excluded from this exhibit because it is both (i) not material and (ii) would be competitively harmful if publicly disclosed. 1.10. The term \"Products\" shall mean any in-person remote (e.g., livestream of a live event, recording of a live event, and on-demand) product or service offerings in real estate investing strategies and techniques, asset protection, and entrepreneurship in any form of communication or media to one or more recipients, including, but not limited to, workshops, seminars, webinars, coaching, and mentorships, as may be offered by LEA in the conduct of the Business and for which a fee is charged by LEA. 1.11. The term \"T&B Personality\" shall mean Tarek El Moussa. 1.12 The term \"Term\" shall mean an initial term of five years, automatically renewable thereafter for successive 5-year terms unless either party provides prior written notice of termination not less than 90 d Royalty for six (6) consecutive months. 3.4. LEA may distribute goods and services embodying the Licensed Intellectual Property to end users for personal use only in connect with the Business, and for resale, distribution or re-licensing by such end users. 3.5 LEA acknowledges and agrees that, except as otherwise specifically provided for herein, this Agreement grants LEA no title or right of ownership in or to the Licensed Intellectual Property. LEA shall not at any time do or cause to be done any act, omission, or thing contesting or in any way impairing or tending to impair any part of T&B's right, title and interest in the Licensed Intellectual Property. 3.6 In the event LEA shall be deemed to have acquired any ownership rights in the Licensed Intellectual Property, the LEA shall assign, and agrees to execute all documents reasonably requested by T&B to assign, all such rights in the Licensed Intellectual Property to T&B or its nominee. 4. Conduct of the Business 4.1 LEA shall provide administrative and operational services for the conduct of the Business, including, marketing, event planning, sales, operations, information technologies, human resources, and class fulfillment. In consultation with T&B and subject to the licenses granted to LEA by T&B herein, LEA shall be responsible for branding the Business (including trademarks and trade dress) and creating and producing marketing collateral, sales presentations, course materials and other tangible work product and deliverables related to the conduct of the Business (collectively, \"Work Product\").\n\n4\n\nSource: LEGACY EDUCATION ALLIANCE, INC., 10-K, 3/30/2020\n\n\n\n\n\nCertain identified information has been excluded from this exhibit because it is both (i) not material and (ii) would be competitively harmful if publicly disclosed. 4.2 LEA and T&B shall jointly own all jointly-created work product including, but not limited to, ideas, any and all concepts, designs, Customer Data (including client lists) uct of the Business. 5.2 The initial launch of the Business is contemplated to occur in four (4) major test markets (e.g. Los Angeles and New York MSAs), with a preview event being conducted in each of weeks 4, 5, 6 and 7 of calendar year 2020 and the associated basic event being held in each of weeks 7, 8, 9, and 10, respectively. To facilitate the effective launch of the Business, T&B shall assist LEA by providing the items listed in Schedule 1 attached to this Agreement and incorporated herein by reference. 6. Personal Appearances 6.1 T&B Personality shall make six (6) public appearances each year of the Term, including an appearance at LEA's annual Hall of Fame Symposium, for the purpose of promoting the Business, which appearances may include autograph sessions, book signings, appearances at LEA's workshops, seminars and symposiums with each such session not to exceed four (4) hours. LEA shall compensate T&B Personality the sum of [$●] plus first-class air and hotel accommodations for up to three (3) additional persons for each such appearance.\n\n5\n\nSource: LEGACY EDUCATION ALLIANCE, INC., 10-K, 3/30/2020\n\n\n\n\n\nCertain identified information has been excluded from this exhibit because it is both (i) not material and (ii) would be competitively harmful if publicly disclosed. 6.2 The parties may also conduct up to 10 \"big stage\" live events each year to market Products. LEA may request T&B Personality to appear at such events for not more than eight (8) hours each, subject to T&B Personality's availability. LEA shall compensate T&B Personality the sum of [$●] plus first-class air and hotel accommodations for up to three (3) additional persons for each such appearance. 7. New Product Development 7.1 Co-Developed Products. T&B and LEA shall meet and confer no less than quarterly to identify new Tarek's Real Estate 101 Product development, marketing and fulfillment initiatives, including, by way of example only, (i) mobile apps that provide investor resources and property evaluations, (ii) podcasts with T&B Personality that provide content to keep up to date with investing techniques and motivation, and (iii) tailored coaching programs and subscription services. The parties acknowledge that the development and fulfillment of such new Products may require substantial time and effort by the T&B Personality to fulfill such new Products such that the Marketing Royalty payable pursuant to V. B., above, is inadequate to compensate T&B Personality; therefore, in lieu of any other royalty, the parties shall share Cash Sales from the sale of such new Products as follows: [●%] to LEA [●%] to T&B 7.2 T&B Developed Products. In addition, T&B may independently develop Products to be marketed and sold by T&B and fulfilled by T&B. In lieu of any other royalty, the parties shall share Cash Sales from the sale of such independently developed T&B Products that are generated directly and independently by LEA as follows: [●%] to LEA [●%] to T&B 8. Confidentiality 8.1. Each party acknowledges the other's Confidential Information is unique and valuable and was developed or otherwise acquired by the other at great expense, and that any unauthorized disclosure or use of the other's Confidential Information would cause the other irreparable injury loss for which damages would be an inadequate remedy. The party agrees to hold such Confidential Information in strictest confidence, to use all efforts reasonable under the circumstances to maintain the secrecy thereof, and not to make use thereof other than in accordance with this Agreement, and not to release or disclose Confidential Information to any third party without the other's prior written consent, subject to a court order, or subject to a sublicense consistent with this Agreement and requiring the sublicensee to maintain the Confidential Information in strictest confidence, to use all efforts reasonable under the circumstances to maintain the secrecy thereof, not to make use thereof other than in accordance with the sublicense Agreement, and not to release or disclose Confidential Information to any third party without the other's prior written consent.\n\n6\n\nSource: LEGACY EDUCATION ALLIANCE, INC., 10-K, 3/30/2020\n\n\n\n\n\nCertain identified information has been excluded from this exhibit because it is both (i) not material and (ii) would be competitively harmful if publicly disclosed. 8.2. Each party further acknowledges that any violation of this Section 5 shall constitute a material breach of this License Agreement resulting in irreparable injury to the non-breaching party and agree that, in addition to any and all other rights available to the non-breathing party by law or by this Agreement, the non-breaching party shall have the right to have an injunction entered against the party to enjoin any further violations of this Agreement. 9. Royalties and Reporting 9.1. In consideration of the rights to be granted by T&B to LEA, LEA agrees to pay T&B: 9.1.1 Base Royalty. In consideration of the License granted and other good and valuable consideration provided by T&B to LEA, LEA shall pay to T&B a base royalty (\"Base Royalty\") in the amount of [●%] of LEA's monthly Cash Sales for Cash Sales of up to [$●]. For monthly Cash Sales above [$●] and up to [$●] , the Base Royalty paid to T&B by LEA shall be [●%]of the LEA's Cash Sales. For monthly Cash Sales above [$●] and up to [$●] the Base Royalty paid to T&B by LEA shall be [●%] of the LEA's Cash Sales. For monthly Cash Sales above [$●] and up to [$●], the Base Royalty paid to T&B by LEA shall be [●%] of the LEA's Cash Sales. For monthly Cash Sales above [$●]the Base Royalty paid to T&B by LEA shall be [●%] of the LEA's Cash Sales. Payments will be made in U.S. Dollars. 9.1.2 Marketing Royalty: Marketing Royalty: In consideration of T&B Personality providing commercially reasonable, regular and periodic marketing support to LEA substantially in accordance with Schedule 2 attached to this Agreement and incorporated herein by reference, which LEA agrees to request and accept from T&B consistently during the Term, LEA will pay T&M a royalty in addition to the Base Royalty (\"Marketing Royalty\") which shall be comprised of and calculated at [●%] of LEA's Cash Sales made from the sale of Products at live events and [●%] of LEA's Cash Sales made from the sale of Products at on-line webinars. For the avoidance of doubt, the Base Royalty and Marketing Royalty shall be cumulative and calculated independently, without overlap. Further, nothing herein shall be construed to enable LEA to refuse to accept reasonable, regular and periodic marketing support from T&B as a means to avoid paying T&B a Marketing Royalty. In the event, T&B offers, but LEA refuses to request or accept reasonable, regular and periodic marketing support from T&B during the Term, LEA shall continue to be obligated to pay T&B a Marketing Royalty as if such marketing support had been requested and accepted by LEA. 9.2 Minimum Guaranteed Royalty: In consideration of the exclusivity rights granted to LEA, commencing with the seventh (7t h) month of the Term and continuing each year of the Term thereafter, the minimum Royalties payable to T&B each month shall be the greater of the (i) applicable monthly Base Royalty and Marketing Royalty or (ii) $200,000. 9.3 Base Royalties and Marketing Royalties shall be paid monthly to T&M within 15 days after the end of the applicable month. Payments will be made in U.S. Dollars.\n\n7\n\nSource: LEGACY EDUCATION ALLIANCE, INC., 10-K, 3/30/2020\n\n\n\n\n\nCertain identified information has been excluded from this exhibit because it is both (i) not material and (ii) would be competitively harmful if publicly disclosed. 9.4. For each Base Royalty and Marketing Royalty payment (collectively, \"Royalty Payment\"), LEA shall render to T&B, a written statement, in such form as T&B may reasonably request, setting forth Cash Sales made during the period to which the Royalty Payment relates, and such other information as T&B may reasonably request to verify the Royalty Payments due hereunder. LEA shall keep such written records respecting Cash Sales as T&B may reasonably request so that Royalty Payments payable hereunder may be accurately determined and shall permit such records to be examined by T&B or its authorized representative upon reasonable prior written notice at any reasonable time during regular business hours to verify the records, reports and payments herein provided. 9.5. LEA shall be responsible for, and shall pay, all sales, value added and similar taxes, if any, which may be imposed on any receipts of the Trainings sold hereunder, as well as any other tax based upon LEA's use of the Licensed Intellectual Property in connection with the Business. 9.6 T&B ACKNOWLEDGES AND AGREES THAT NO REPRESENTATIONS OR STATEMENTS OF ACTUAL, AVERAGE, PROJECTED OR FORECASTED SALES, PROFITS, ROYALTIES, OR EARNINGS HAVE BEEN MADE WITH RESPECT TO THE BUSINESS CONTEMPLATED BY THIS AGREEMENT. 10. Warranties and Representations. 10.1 T&B warrants and represents that: 10.1.1 It is a corporation duly organized, validly existing, and in good standing under the laws of the state of California with all requisite power and authority to execute, deliver and perform this Agreement. 10.1.2 All necessary actions on the part of T&B have been duly taken to authorize the execution, delivery, and performance of the Agreement by T&B. 10.1.3 This Agreement has been duly authorized, executed, and delivered by T&B, constitutes the legal, valid, and binding obligation of T&B and is enforceable in accordance with its terms. 10.1.4 It has the right to grant the licenses and enter into this Agreement without seeking the approval or consent of any third party and without payments to any third party. 10.1.5 There are no existing or threatened claims or proceedings by any entity relating to the Licensed Intellectual Property or challenging T&B's ownership of the sa ll not contract with Christina Anstead during the Term. 11. Term and Termination. 11.1 The Term shall commence upon the Effective Date and shall continue for an initial term of five (5) years. The Term shall automatically renew thereafter for successive 5-year terms unless either party provides prior written notice of termination not less than 90 days prior to the end of such five-year term. 11.2 The Agreement may be terminated: (i) immediately by either party in the event of a breach of this Agreement by the other party that is susceptible of cure and such breach is not cured within the 30-day period after written notice of such breach to the breaching party. (ii) by either party, immediately, if the other party becomes insolvent, makes an assignment for the benefit of its creditors, or becomes the subject of any bankruptcy or insolvency proceedings, and such proceedings are not vacated within sixty (60) days of their initiation.\n\n9\n\nSource: LEGACY EDUCATION ALLIANCE, INC., 10-K, 3/30/2020\n\n\n\n\n\nCertain identified information has been excluded from this exhibit because it is both (i) not material and (ii) would be competitively harmful if publicly disclosed. (iii) by either party, if the other party ceases to do business. (iv) by LEA, immediately, in the event LEA is enjoined by a court of competent jurisdiction from using any of the Licensed Intellectual Property. (v) by LEA if the T&B Personality engages in illegal, immoral, or criminal conduct resulting in a felony conviction; or misrepresents or conceals anything in his or her background that could be detrimental to the value of the endorsement being made. 11.3 Upon termination of the license hereunder, all rights and privileges in and to the Licensed Intellectual Property granted to the LEA herein shall automatically revert to T&B or its nominee, and the LEA shall immediately cease any use thereof. 11.4. LEA shall, for a period of six (6) months (\"Sell-Off Period\") following the effective date of termination of the license granted by T&B hereunder, have the right to fulfill commitments made to customers during the Term. The provisions of this Agreement shall apply with full force and effect during the Sell-Off Period. Upon expiration of the Sell-Off Period, LEA shall immediately cease and desist from using or displaying any forms of advertising containing any of the Licensed Marks. 11.5 Sections 4.2; 8 (Confidentiality); 10 (Warranties and Representations); 12 (Indemnification); and 14 (Miscellaneous) hereof shall survive the expiration or early termination (for any reason) of this Agreement. 12. Indemnification. 12.1 Each party shall defend, indemnify and hold harmless the other party and their respective Affiliates and their respective officers, directors, agents, contractors, employees, successor, and assigns from and against all claims, demands or causes of action, as well as any and all damages, expenses, costs, interest and reasonable legal fees, including such fees incurred on appeal, in any way related to, arising out of or connected with a breach of the indemnifying party's representations, warranties or covenants under this Agreement. Without limiting the generality of the foregoing, LEA shall defend, hold harmless and indemnify T&B and T&B's agents and employees from and against any and all claims, demands, losses, disputes, causes of action or damages, including, without limitation, FTC actions or other regulatory actions, and/or attorneys' fees arising out of or relating to the promotion, distribution and/or sale of any financial education programs, products or services, including (but not limited to) live presentations, print advertising, radio advertising, direct mail, outbound calls, email marketing, affiliate marketing, online advertising, infomercials and other marketing methods, by or through LEA, In any instance to which such indemnities pertain, LEA shall obtain and maintain necessary insurance, including, without limitation, Commercial Ge   <script>
    const data = JSON.parse(document.getElementById('app-data').textContent);
    const conversations = [
      { id: 'summary', kind: 'summary', title: 'Summary of 41 questions', subtitle: `${data.stats.documents} documents · ${data.stats.question_rows} question rows`, avatar: 'S' },
      ...data.contracts.map((contract, index) => ({
        id: `contract-${index}`,
        kind: 'contract',
        title: contract.title,
        subtitle: `Contract ${contract.document_row_id} · 41 golden-answer rows`,
        avatar: String(index + 1),
        contract,
      })),
    ];
    let activeId = 'summary';

    const listEl = document.getElementById('conversationList');
    const messagesEl = document.getElementById('messages');
    const titleEl = document.getElementById('chatTitle');
    const subtitleEl = document.getElementById('chatSubtitle');
    const avatarEl = document.getElementById('chatAvatar');
    const searchEl = document.getElementById('search');

    function esc(value) {
      return String(value ?? '').replace(/[&<>'"]/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[ch]));
    }

    function answerHtml(answers) {
      if (!answers || answers.length === 0) return '<span class="empty">No golden answer</span>';
      return answers.map(esc).join('\n\n');
    }

    function renderList() {
      const needle = searchEl.value.trim().toLowerCase();
      listEl.innerHTML = conversations
        .filter(c => !needle || c.title.toLowerCase().includes(needle) || c.subtitle.toLowerCase().includes(needle))
        .map(c => `
          <button class="conversation ${c.id === activeId ? 'active' : ''}" data-id="${esc(c.id)}">
            <div class="avatar">${esc(c.avatar)}</div>
            <div><h3>${esc(c.title)}</h3><p>${esc(c.subtitle)}</p></div>
          </button>
        `).join('');
      listEl.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
        activeId = btn.dataset.id;
        render();
      }));
    }

    function renderSummary() {
      const rows = data.summary.map(row => `
        <tr>
          <td class="idx">${row.question_index + 1}</td>
          <td class="category">${esc(row.category)}<br><span class="pill">Group ${esc(row.group || '-')}</span></td>
          <td>${esc(row.description)}<br><span class="pill">${esc(row.answer_format || 'No answer format')}</span></td>
          <td>${row.docs_with_answers}</td>
          <td>${row.docs_without_answers}</td>
          <td>${row.total_answer_spans}</td>
        </tr>
      `).join('');
      messagesEl.innerHTML = `
        <article class="message incoming">
          <h2>Question Set Summary</h2>
          <div class="meta-grid">
            <div class="metric"><b>${data.stats.documents}</b><span>Documents</span></div>
            <div class="metric"><b>${data.stats.questions_per_document}</b><span>Questions per document</span></div>
            <div class="metric"><b>${data.stats.question_rows}</b><span>Question rows</span></div>
            <div class="metric"><b>${data.stats.selected_contracts}</b><span>Sample chats</span></div>
          </div>
        </article>
        <article class="message outgoing"><p>The category descriptions were joined by question order after validating every document has the same 41-question sequence.</p></article>
        <article class="message incoming">
          <div class="table-wrap">
            <table>
              <thead><tr><th>#</th><th>Category</th><th>Description</th><th>Docs with answers</th><th>No answer</th><th>Answer spans</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </article>
      `;
    }

    function renderContract(contract) {
      const answerRows = contract.questions.map(row => `
        <tr>
          <td class="idx">${row.question_index + 1}</td>
          <td class="category">${esc(row.category)}<br><span class="pill">${esc(row.answer_format || 'No format')}</span></td>
          <td>${esc(row.question)}</td>
          <td class="answer">${answerHtml(row.answers)}${row.is_impossible ? '<br><span class="pill warn">Marked impossible</span>' : ''}</td>
        </tr>
      `).join('');
      messagesEl.innerHTML = `
        <article class="message outgoing"><p>${esc(contract.title)}</p></article>
        <article class="message incoming">
          <details>
            <summary>Expand full contract text</summary>
            <div class="contract-text">${esc(contract.context)}</div>
          </details>
        </article>
        <article class="message incoming">
          <div class="table-wrap">
            <table>
              <thead><tr><th>#</th><th>Category</th><th>Question</th><th>Golden answer</th></tr></thead>
              <tbody>${answerRows}</tbody>
            </table>
          </div>
        </article>
      `;
    }

    function render() {
      const active = conversations.find(c => c.id === activeId) || conversations[0];
      titleEl.textContent = active.title;
      subtitleEl.textContent = active.subtitle;
      avatarEl.textContent = active.avatar;
      if (active.kind === 'summary') renderSummary();
      else renderContract(active.contract);
      renderList();
    }

    searchEl.addEventListener('input', renderList);
    render();
  </script>
